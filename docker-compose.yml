services:
  api:
    build: .
    env_file:
      - .env
    environment:
      AIDAR_DATABASE_PATH: /app/data/aidar.sqlite
      AIDAR_TEMP_ROOT: /app/data/tmp
      AIDAR_HOST: 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - aidar-data:/app/data
    restart: unless-stopped

volumes:
  aidar-data:
