# Do not enable until OpenReview verification and request-frequency limits exist.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName submityour.work
    ServerAlias www.submityour.work

    DocumentRoot /var/www/html/submityour.work/public
    <Directory /var/www/html/submityour.work/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/submityour.work/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/submityour.work/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyAddHeaders On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader unset X-Forwarded-For

    Header always set Strict-Transport-Security "max-age=86400"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'"

    # Administrative routes are never reachable through the public vhost.
    ProxyPass /v1/admin !
    <LocationMatch "^/v1/admin(?:/|$)">
        Require all denied
    </LocationMatch>

    # Only documented author endpoints and health are eligible for proxying.
    ProxyPass /health http://127.0.0.1:39740/health retry=0 connectiontimeout=3 timeout=10
    ProxyPassReverse /health http://127.0.0.1:39740/health
    ProxyPass /v1/author/ http://127.0.0.1:39740/v1/author/ retry=0 connectiontimeout=3 timeout=120
    ProxyPassReverse /v1/author/ http://127.0.0.1:39740/v1/author/

    LimitRequestBody 105906176
    RequestReadTimeout header=10-20,MinRate=500 body=20,MinRate=500

    ErrorLog /var/log/apache2/submityour.work-error.log
    # Authorization headers and bodies are not part of Apache's combined format.
    CustomLog /var/log/apache2/submityour.work-access.log combined
</VirtualHost>
</IfModule>
