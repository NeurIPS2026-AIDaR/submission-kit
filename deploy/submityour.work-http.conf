# HTTP-only bootstrap vhost. This serves no application traffic.
# Enable only for ACME issuance after DNS resolves to this host.
<VirtualHost *:80>
    ServerName submityour.work
    ServerAlias www.submityour.work

    DocumentRoot /var/www/html/submityour.work/public
    <Directory /var/www/html/submityour.work/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]

    ErrorLog /var/log/apache2/submityour.work-error.log
    CustomLog /var/log/apache2/submityour.work-access.log combined
</VirtualHost>
