schema_version: "0.1"

submission:
  title: "Anonymous workshop submission"
  artifact_types:
    - manuscript
    - code
    - results

manuscript:
  pdf: manuscript/paper.pdf
  source: manuscript/source

artifacts:
  - path: code
    type: code
    description: Analysis implementation
  - path: results
    type: results
    description: Machine-readable result summaries
  - path: data/README.md
    type: data_documentation
    description: Data access and license notes

claims:
  path: claims/claims.json
  required: false

reproduction:
  entrypoint: "python code/run_analysis.py"
  execution_policy: manual_only
  network_required: false

availability:
  data:
    status: synthetic
    reason: "This package is a local pilot fixture"
