[package]
name = "aidar-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Standalone author client for AIDaR submissions"

[[bin]]
name = "aidar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
flate2 = "1"
hex = "0.4"
hmac = "0.12"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
